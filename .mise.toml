[tools]
node = "24"
bun = "1.3"

# Convention: the `setup` task is invoked once per repo on every fresh devbox
# provision (by the `repos` Ansible role) and once on every `clone-repo` skill
# run. Fill in this repo's first-time install command — e.g. `pnpm install`,
# `cargo fetch`, `pip install -e .`, `bundle install`, etc.
[tasks.setup]
description = "First-time setup after clone (deps, codegen, …)"
# Docs only for now (no package.json): a no-op until code lands, then bun install.
run = "test ! -f package.json || bun install"

# No gates yet (devbox docs/ci.md § Repo tasks): the repo is research docs only, with no
# code to lint or test. Replace these markers with real tasks once code lands.
# dev-contract: skip task-pre-push — owner's call 2026-10-29, nothing to check yet (docs only, no code)
# dev-contract: skip task-pre-merge — owner's call 2026-10-29, nothing to test yet (docs only, no code)

